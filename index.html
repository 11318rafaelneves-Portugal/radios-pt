<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radios-PT</title>
    <!-- Tailwind CSS para um design moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HLS.js para suportar streams HLS (.m3u8) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans">

    <!-- CABEÇALHO -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg flex items-center justify-center">
                    <i class="fa-solid fa-radio text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Radios-PT</h1>
                    <p class="text-xs text-slate-400">Portugal, Espanha & Mundo</p>
                </div>
            </div>

            <!-- PESQUISA -->
            <div class="relative w-full sm:w-64">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar rádio..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500 transition">
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 pb-32">

        <!-- ESPAÇO DE FUTURA PUBLICIDADE (BANNER AD) -->
        <div id="adBanner" class="bg-gradient-to-r from-indigo-900/60 to-purple-900/60 border border-indigo-500/30 rounded-2xl p-4 mb-6 flex items-center justify-between shadow-lg relative overflow-hidden">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-500/20 p-2.5 rounded-lg text-indigo-400">
                    <i class="fa-solid fa-rectangle-ad text-lg"></i>
                </div>
                <div>
                    <span class="text-xs font-semibold uppercase tracking-wider text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded">Patrocinado</span>
                    <p class="text-sm font-medium text-slate-200 mt-1">Espaço reservado para futura publicidade (Banner)</p>
                </div>
            </div>
            <button onclick="dismissAd()" class="text-slate-400 hover:text-white p-1 transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- ABAS DE PAÍSES -->
        <div class="flex overflow-x-auto gap-2 mb-6 pb-2 scrollbar-none">
            <button onclick="filterCountry('all')" class="tab-btn px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white transition shadow-md whitespace-nowrap">
                <i class="fa-solid fa-globe mr-2"></i>Todas
            </button>
            <button onclick="filterCountry('pt')" class="tab-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">
                🇵🇹 Portugal (<span id="ptCount">0</span>)
            </button>
            <button onclick="filterCountry('es')" class="tab-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">
                🇪🇸 Espanha
            </button>
            <button onclick="filterCountry('world')" class="tab-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap">
                🌍 Mundial
            </button>
        </div>

        <!-- SECÇÃO DE FAVORITOS (APARECE NO TOPO SE HOUVER) -->
        <div id="favoritesSection" class="mb-8 hidden">
            <h2 class="text-sm font-bold text-indigo-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                <i class="fa-solid fa-star text-amber-400"></i> As Minhas Favoritas
            </h2>
            <div id="favoritesGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- Preenchido via JavaScript -->
            </div>
        </div>

        <!-- LISTA DE RÁDIOS -->
        <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Estações Disponíveis</h2>
        <div id="radiosGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <!-- Preenchido via JavaScript -->
        </div>

    </main>

    <!-- PLAYER DE ÁUDIO STICKY (FIXO EMBAIXO) -->
    <footer id="audioPlayerBar" class="fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 p-4 shadow-2xl hidden z-50">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center shrink-0 shadow-inner">
                    <i id="playerIcon" class="fa-solid fa-volume-high animate-pulse"></i>
                </div>
                <div class="truncate">
                    <h3 id="playerTitle" class="text-sm font-bold truncate">Selecione uma Rádio</h3>
                    <p id="playerSubtitle" class="text-xs text-slate-400 truncate">A carregar...</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="togglePlayPause()" class="w-12 h-12 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-lg transition">
                    <i id="playPauseIcon" class="fa-solid fa-pause"></i>
                </button>
            </div>
        </div>
        <audio id="audioElement" preload="none"></audio>
    </footer>

        let currentFilter = 'all';

        let favorites = JSON.parse(localStorage.getItem('radios_pt_favs')) || [];

        // Detetor de Erros no Elemento de Áudio
        currentAudio.addEventListener('error', (e) => {
            if (currentStation) {
                console.error(`[ERRO DE STREAM] A rádio "${currentStation.name}" falhou. URL: ${currentStation.url}`);
                document.getElementById('playerSubtitle').textContent = "⚠️ Erro: Stream offline ou bloqueado";
                alert(`A rádio "${currentStation.name}" está a dar erro de reprodução (stream offline ou bloqueado por segurança).`);
            }
        });

        // Atualizar contador de Portugal na interface
        document.getElementById('ptCount').textContent = radios.filter(r => r.country === 'pt').length;

        function renderRadios() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('radiosGrid');
            const favGrid = document.getElementById('favoritesGrid');
            const favSection = document.getElementById('favoritesSection');

            grid.innerHTML = '';
            favGrid.innerHTML = '';

            const filtered = radios.filter(r => {
                const matchesCountry = currentFilter === 'all' || r.country === currentFilter;
                const matchesSearch = r.name.toLowerCase().includes(searchQuery) || r.genre.toLowerCase().includes(searchQuery);
                return matchesCountry && matchesSearch;
            });

            const favRadios = radios.filter(r => favorites.includes(r.id));
            if (favRadios.length > 0 && currentFilter === 'all' && !searchQuery) {
                favSection.classList.remove('hidden');
                favRadios.forEach(r => {
                    favGrid.appendChild(createRadioCard(r, true));
                });
            } else {
                favSection.classList.add('hidden');
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="text-slate-500 text-sm col-span-full text-center py-6">Nenhuma estação encontrada.</p>`;
                return;
            }

            filtered.forEach(r => {
                grid.appendChild(createRadioCard(r, false));
            });
        }

        function createRadioCard(radio, isFavContainer) {
            const isPlaying = currentStation && currentStation.id === radio.id && !currentAudio.paused;
            const isFav = favorites.includes(radio.id);

            const card = document.createElement('div');
            card.className = `bg-slate-800 border ${isPlaying ? 'border-indigo-500 shadow-indigo-500/20 shadow-lg' : 'border-slate-700/60'} rounded-2xl p-4 flex items-center justify-between hover:border-slate-600 transition`;
            
            card.innerHTML = `
                <div class="flex items-center gap-3.5 cursor-pointer flex-1 overflow-hidden" onclick="playStation('${radio.id}')">
                    <div class="w-11 h-11 rounded-xl ${isPlaying ? 'bg-indigo-600 animate-pulse' : 'bg-slate-700'} flex items-center justify-center shrink-0 text-white font-bold text-xs shadow">
                        ${isPlaying ? '<i class="fa-solid fa-volume-high"></i>' : radio.name.substring(0, 2).toUpperCase()}
                    </div>
                    <div class="truncate">
                        <h3 class="text-sm font-bold text-slate-100 truncate">${radio.name}</h3>
                        <p class="text-xs text-slate-400 truncate">${radio.genre} • <span class="uppercase text-[10px] bg-slate-700 px-1.5 py-0.5 rounded text-slate-300">${radio.country}</span></p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="toggleFavorite('${radio.id}')" class="text-slate-400 hover:text-amber-400 p-2 transition">
                        <i class="${isFav ? 'fa-solid text-amber-400' : 'fa-regular'} fa-star"></i>
                    </button>
                    <button onclick="playStation('${radio.id}')" class="w-10 h-10 rounded-xl ${isPlaying ? 'bg-indigo-600 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-200'} flex items-center justify-center transition shadow">
                        <i class="fa-solid ${isPlaying ? 'fa-pause' : 'fa-play'} text-xs"></i>
                    </button>
                </div>
            `;
            return card;
        }

        function playStation(id) {
            const station = radios.find(r => r.id === id);
            if (!station) return;

            const playerBar = document.getElementById('audioPlayerBar');
            const playerTitle = document.getElementById('playerTitle');
            const playerSubtitle = document.getElementById('playerSubtitle');
            const playPauseIcon = document.getElementById('playPauseIcon');

            if (currentStation && currentStation.id === id) {
                if (currentAudio.paused) {
                    currentAudio.play();
                    playPauseIcon.className = "fa-solid fa-pause";
                } else {
                    currentAudio.pause();
                    playPauseIcon.className = "fa-solid fa-play";
                }
            } else {
                currentStation = station;

                if (hlsInstance) {
                    hlsInstance.destroy();
                    hlsInstance = null;
                }

                playerBar.classList.remove('hidden');
                playerTitle.textContent = station.name;
                playerSubtitle.textContent = `A ligar ao stream...`;
                playPauseIcon.className = "fa-solid fa-pause";

                if (station.isHls && Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(station.url);
                    hlsInstance.attachMedia(currentAudio);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        currentAudio.play().then(() => {
                            playerSubtitle.textContent = `${station.genre} • Em direto`;
                        }).catch(e => {
                            console.error(`Erro HLS play:`, e);
                        });
                    });
                    hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            console.error(`[ERRO HLS FATAL] Rádio: ${station.name}`, data);
                            playerSubtitle.textContent = "⚠️ Erro no stream HLS";
                        }
                    });
                } else {
                    currentAudio.src = station.url;
                    currentAudio.play().then(() => {
                        playerSubtitle.textContent = `${station.genre} • Em direto`;
                    }).catch(e => {
                        console.error(`[ERRO HTML5 AUDIO] Rádio: ${station.name}`, e);
                        playerSubtitle.textContent = "⚠️ Erro de reprodução";
                    });
                }
            }
            renderRadios();
        }

        function togglePlayPause() {
            if (!currentStation) return;
            const playPauseIcon = document.getElementById('playPauseIcon');
            if (currentAudio.paused) {
                currentAudio.play();
                playPauseIcon.className = "fa-solid fa-pause";
            } else {
                currentAudio.pause();
                playPauseIcon.className = "fa-solid fa-play";
            }
            renderRadios();
        }

        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(fav => fav !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('radios_pt_favs', JSON.stringify(favorites));
            renderRadios();
        }

        function filterCountry(country) {
            currentFilter = country;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap";
            });
            event.currentTarget.className = "tab-btn px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white transition shadow-md whitespace-nowrap";
            renderRadios();
        }

        function dismissAd() {
            document.getElementById('adBanner').style.display = 'none';
        }

        document.getElementById('searchInput').addEventListener('input', renderRadios);

        renderRadios();
    </script>
</body>
</html>
