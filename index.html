<!DOCTYPE html>
<html lang="pt">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radios-PT</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans select-none">

    <!-- CABEÇALHO -->
    <header class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700 p-4 sticky top-0 z-50 shadow-xl">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 text-white p-2.5 rounded-2xl shadow-lg shadow-indigo-500/30 flex items-center justify-center">
                    <i class="fa-solid fa-radio text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wide bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Radios-PT</h1>
                    <p class="text-xs text-slate-400">Portugal, Espanha & Mundo</p>
                </div>
            </div>

            <!-- PESQUISA (Gatilho secreto: "definições") -->
            <div class="relative w-full sm:w-72">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar rádio ou género..." 
                    class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500 transition shadow-inner">
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 pb-36">

        <!-- PAINEL SECRETO DE DIAGNÓSTICO -->
        <div id="secretAdminPanel" class="hidden bg-slate-800/95 border-2 border-amber-500/60 rounded-3xl p-5 mb-6 shadow-2xl backdrop-blur-md">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-700 pb-3 mb-4">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-screwdriver-wrench text-amber-400"></i>
                    <h2 class="font-bold text-base text-amber-400">Painel Secreto — Diagnóstico de Streams</h2>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="runBackgroundCheck()" class="bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold px-3.5 py-2 rounded-xl transition shadow">
                        <i class="fa-solid fa-rotate-right mr-1"></i> Re-testar Todas
                    </button>
                    <button onclick="closeSecretPanel()" class="bg-slate-700 hover:bg-slate-600 text-xs font-semibold px-3.5 py-2 rounded-xl transition">
                        Fechar
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3 mb-4 text-center">
                <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-700/60 shadow-inner">
                    <span class="block text-xs text-slate-400 font-medium">A Funcionar</span>
                    <span id="statOk" class="text-xl font-black text-emerald-400">0</span>
                </div>
                <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-700/60 shadow-inner">
                    <span class="block text-xs text-slate-400 font-medium">Com Erro</span>
                    <span id="statFail" class="text-xl font-black text-rose-400">0</span>
                </div>
                <div class="bg-slate-900/80 p-3.5 rounded-2xl border border-slate-700/60 shadow-inner">
                    <span class="block text-xs text-slate-400 font-medium">Pendentes</span>
                    <span id="statPending" class="text-xl font-black text-amber-400">0</span>
                </div>
            </div>

            <div class="flex items-center justify-between mb-2">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Estado dos Streams:</h3>
                <button onclick="copyBrokenList()" class="text-xs text-indigo-400 hover:underline font-medium">
                    <i class="fa-regular fa-copy mr-1"></i>Copiar erros
                </button>
            </div>
            <div id="brokenRadiosList" class="max-h-60 overflow-y-auto space-y-2 bg-slate-900/90 p-3 rounded-2xl border border-slate-700 text-xs">
                <p class="text-slate-500 italic">Escreva "definições" na pesquisa para abrir ou clique em testar.</p>
            </div>
        </div>

        <!-- ABAS DE PAÍSES -->
        <div class="flex overflow-x-auto gap-2 mb-6 pb-2 scrollbar-none">
            <button onclick="filterCountry('all', this)" class="tab-btn px-4 py-2.5 rounded-2xl text-sm font-semibold bg-indigo-600 text-white transition shadow-lg shadow-indigo-600/25 whitespace-nowrap">
                <i class="fa-solid fa-globe mr-2"></i>Todas (<span id="allCount">0</span>)
            </button>
            <button onclick="filterCountry('pt', this)" class="tab-btn px-4 py-2.5 rounded-2xl text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap border border-slate-700/50">
                🇵🇹 Portugal (<span id="ptCount">0</span>)
            </button>
            <button onclick="filterCountry('es', this)" class="tab-btn px-4 py-2.5 rounded-2xl text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap border border-slate-700/50">
                🇪🇸 Espanha & Los 40 (<span id="esCount">0</span>)
            </button>
            <button onclick="filterCountry('world', this)" class="tab-btn px-4 py-2.5 rounded-2xl text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap border border-slate-700/50">
                🌍 Mundial (<span id="worldCount">0</span>)
            </button>
        </div>

        <!-- FAVORITOS -->
        <div id="favoritesSection" class="mb-8 hidden">
            <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                <i class="fa-solid fa-star text-amber-400"></i> As Minhas Favoritas
            </h2>
            <div id="favoritesGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
        </div>

        <!-- LISTA -->
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center justify-between">
            <span>Estações Disponíveis</span>
            <span id="resultCount" class="text-slate-500 font-normal"></span>
        </h2>
        <div id="radiosGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>

    </main>

    <!-- PLAYER STICKY -->
    <footer id="audioPlayerBar" class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur-xl border-t border-slate-700/80 p-4 shadow-2xl hidden z-40">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-3.5 overflow-hidden">
                <div class="w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center shrink-0 shadow-lg shadow-indigo-600/30">
                    <i id="playerIcon" class="fa-solid fa-volume-high animate-pulse text-white text-base"></i>
                </div>
                <div class="truncate">
                    <h3 id="playerTitle" class="text-sm font-bold text-white truncate">Selecione uma Rádio</h3>
                    <p id="playerSubtitle" class="text-xs text-slate-400 truncate">A carregar stream...</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="togglePlayPause()" class="w-12 h-12 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-lg shadow-indigo-600/30 transition transform active:scale-95">
                    <i id="playPauseIcon" class="fa-solid fa-pause text-sm"></i>
                </button>
            </div>
        </div>
        <audio id="audioElement" preload="none"></audio>
    </footer>

        function updateCounters() {
            document.getElementById('ptCount').textContent = radios.filter(r => r.country === 'pt').length;
            document.getElementById('esCount').textContent = radios.filter(r => r.country === 'es').length;
            document.getElementById('worldCount').textContent = radios.filter(r => r.country === 'world').length;
            document.getElementById('allCount').textContent = radios.length;
        }

        function renderRadios() {
            const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (searchQuery === 'definições' || searchQuery === 'definicoes') {
                document.getElementById('secretAdminPanel').classList.remove('hidden');
            }

            const grid = document.getElementById('radiosGrid');
            const favGrid = document.getElementById('favoritesGrid');
            const favSection = document.getElementById('favoritesSection');
            const resultCountEl = document.getElementById('resultCount');

            grid.innerHTML = '';
            favGrid.innerHTML = '';

            const filtered = radios.filter(r => {
                const matchesCountry = currentFilter === 'all' || r.country === currentFilter;
                const matchesSearch = r.name.toLowerCase().includes(searchQuery) || 
                                      r.genre.toLowerCase().includes(searchQuery);
                return matchesCountry && matchesSearch;
            });

            resultCountEl.textContent = `(${filtered.length} estações)`;

            const favRadios = radios.filter(r => favorites.includes(r.id));
            if (favRadios.length > 0 && currentFilter === 'all' && !searchQuery) {
                favSection.classList.remove('hidden');
                favRadios.forEach(r => favGrid.appendChild(createRadioCard(r)));
            } else {
                favSection.classList.add('hidden');
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 bg-slate-800/40 rounded-3xl border border-slate-700/50"><i class="fa-solid fa-circle-exclamation text-2xl mb-2 text-slate-400"></i><p class="text-sm">Nenhuma estação encontrada.</p></div>`;
                return;
            }

            filtered.forEach(r => grid.appendChild(createRadioCard(r)));
        }

        function createRadioCard(radio) {
            const isPlaying = currentStation && currentStation.id === radio.id && !currentAudio.paused;
            const isFav = favorites.includes(radio.id);
            const statusTest = streamTestResults[radio.id];

            let statusIndicator = '';
            if (statusTest === 'ok') {
                statusIndicator = `<span class="w-2 h-2 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500" title="Ativo"></span>`;
            } else if (statusTest === 'fail') {
                statusIndicator = `<span class="w-2 h-2 rounded-full bg-rose-500 shadow-sm shadow-rose-500" title="Erro"></span>`;
            } else {
                statusIndicator = `<span class="w-2 h-2 rounded-full bg-slate-600" title="Não testado"></span>`;
            }

            const card = document.createElement('div');
            card.className = `bg-slate-800/80 backdrop-blur-sm border ${isPlaying ? 'border-indigo-500 shadow-lg shadow-indigo-500/25 bg-slate-800' : 'border-slate-700/60 hover:border-slate-600'} rounded-2xl p-4 flex items-center justify-between transition-all duration-200 group`;
            
            card.innerHTML = `
                <div class="flex items-center gap-3.5 cursor-pointer flex-1 overflow-hidden" onclick="playStation('${radio.id}')">
                    <div class="w-11 h-11 rounded-xl ${isPlaying ? 'bg-indigo-600 animate-pulse' : 'bg-slate-700 group-hover:bg-slate-600'} flex items-center justify-center shrink-0 text-white font-bold text-xs shadow transition">
                        ${isPlaying ? '<i class="fa-solid fa-volume-high"></i>' : radio.name.substring(0, 2).toUpperCase()}
                    </div>
                    <div class="truncate">
                        <div class="flex items-center gap-2">
                            <h3 class="text-sm font-bold text-slate-100 truncate">${radio.name}</h3>
                            ${statusIndicator}
                        </div>
                        <p class="text-xs text-slate-400 truncate mt-0.5">${radio.genre} • <span class="uppercase text-[10px] bg-slate-700/80 px-1.5 py-0.5 rounded text-slate-300 font-semibold">${radio.country}</span></p>
                    </div>
                </div>
                <div class="flex items-center gap-1 sm:gap-2">
                    <button onclick="toggleFavorite('${radio.id}')" class="text-slate-400 hover:text-amber-400 p-2 transition rounded-xl hover:bg-slate-700/50" title="Favorito">
                        <i class="${isFav ? 'fa-solid text-amber-400' : 'fa-regular'} fa-star text-sm"></i>
                    </button>
                    <button onclick="playStation('${radio.id}')" class="w-10 h-10 rounded-xl ${isPlaying ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'bg-slate-700 hover:bg-slate-600 text-slate-200'} flex items-center justify-center transition shadow">
                        <i class="fa-solid ${isPlaying ? 'fa-pause' : 'fa-play'} text-xs"></i>
                    </button>
                </div>
            `;
            return card;
        }

        function playStation(id) {
            const station = radios.find(r => r.id === id);
            if (!station) return;

            const playerBar = document.getElementById('audioPlayerBar');
            const playerTitle = document.getElementById('playerTitle');
            const playerSubtitle = document.getElementById('playerSubtitle');
            const playPauseIcon = document.getElementById('playPauseIcon');

            if (currentStation && currentStation.id === id) {
                if (currentAudio.paused) {
                    currentAudio.play();
                    playPauseIcon.className = "fa-solid fa-pause text-sm";
                } else {
                    currentAudio.pause();
                    playPauseIcon.className = "fa-solid fa-play text-sm";
                }
            } else {
                currentStation = station;

                if (hlsInstance) {
                    hlsInstance.destroy();
                    hlsInstance = null;
                }

                playerBar.classList.remove('hidden');
                playerTitle.textContent = station.name;
                playerSubtitle.textContent = `A ligar ao stream...`;
                playPauseIcon.className = "fa-solid fa-pause text-sm";

                if (station.isHls && Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(station.url);
                    hlsInstance.attachMedia(currentAudio);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        currentAudio.play().then(() => {
                            playerSubtitle.textContent = `${station.genre} • Em direto`;
                        }).catch(() => {
                            playerSubtitle.textContent = "⚠️ Stream offline ou restrito por CORS";
                        });
                    });
                } else {
                    currentAudio.src = station.url;
                    currentAudio.play().then(() => {
                        playerSubtitle.textContent = `${station.genre} • Em direto`;
                    }).catch(() => {
                        playerSubtitle.textContent = "⚠️ Stream offline ou restrito por CORS";
                    });
                }
            }
            renderRadios();
        }

        function togglePlayPause() {
            if (!currentStation) return;
            const playPauseIcon = document.getElementById('playPauseIcon');
            if (currentAudio.paused) {
                currentAudio.play();
                playPauseIcon.className = "fa-solid fa-pause text-sm";
            } else {
                currentAudio.pause();
                playPauseIcon.className = "fa-solid fa-play text-sm";
            }
            renderRadios();
        }

        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(fav => fav !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('radios_pt_all_favs', JSON.stringify(favorites));
            renderRadios();
        }

        function filterCountry(country, btnElement) {
            currentFilter = country;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-4 py-2.5 rounded-2xl text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition whitespace-nowrap border border-slate-700/50";
            });
            if (btnElement) {
                btnElement.className = "tab-btn px-4 py-2.5 rounded-2xl text-sm font-semibold bg-indigo-600 text-white transition shadow-lg shadow-indigo-600/25 whitespace-nowrap";
            }
            renderRadios();
        }

        function closeSecretPanel() {
            document.getElementById('secretAdminPanel').classList.add('hidden');
        }

        async function runBackgroundCheck() {
            let okCount = 0;
            let failCount = 0;
            let pendingCount = radios.length;

            document.getElementById('statOk').textContent = okCount;
            document.getElementById('statFail').textContent = failCount;
            document.getElementById('statPending').textContent = pendingCount;
            
            const brokenListEl = document.getElementById('brokenRadiosList');
            brokenListEl.innerHTML = `<p class="text-amber-400 italic">A verificar streams...</p>`;

            let brokenItems = [];

            for (let r of radios) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 4000);
                    
                    await fetch(r.url, { method: 'GET', mode: 'no-cors', signal: controller.signal });
                    clearTimeout(timeoutId);
                    
                    streamTestResults[r.id] = 'ok';
                    okCount++;
                } catch (e) {
                    streamTestResults[r.id] = 'fail';
                    failCount++;
                    brokenItems.push(r);
                }
                pendingCount--;

                document.getElementById('statOk').textContent = okCount;
                document.getElementById('statFail').textContent = failCount;
                document.getElementById('statPending').textContent = pendingCount;
            }

            if (brokenItems.length === 0) {
                brokenListEl.innerHTML = `<p class="text-emerald-400">Todos os streams testados responderam positivamente!</p>`;
            } else {
                brokenListEl.innerHTML = brokenItems.map(b => `<div class="text-rose-300 flex justify-between items-center py-1 border-b border-slate-800"><span>❌ ${b.name} (${b.country})</span><span class="text-[10px] text-slate-500 truncate max-w-[150px]">${b.url}</span></div>`).join('');
            }
            renderRadios();
        }

        function copyBrokenList() {
            const broken = radios.filter(r => streamTestResults[r.id] === 'fail').map(r => `${r.name}: ${r.url}`).join('\n');
            if (!broken) {
                alert("Nenhum erro registado ou teste ainda não executado.");
                return;
            }
            const textarea = document.createElement('textarea');
            textarea.value = broken;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert("Lista de erros copiada!");
        }

        document.getElementById('searchInput').addEventListener('input', renderRadios);
        
        updateCounters();
        renderRadios();
    </script>
</body>
</html>
